[project]
name = "essence-engine"
version = "0.1.0"
description = "Local-first engine that distills daily inputs into owned, linked, reusable knowledge."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
essence = "essence.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/essence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
